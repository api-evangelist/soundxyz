aid: soundxyz
name: Sound.xyz
description: >-
  Sound.xyz was a web3 music platform and suite of on-chain tools that let
  artists release music as digital collectibles and host listening parties for
  new releases, building direct economic relationships with their communities.
  The consumer platform went offline on 2026-01-16 (with a successor project,
  Vault.fm), but Sound.xyz's first-party developer surface remains publicly
  published: the open-source Sound protocol (a permissionless Solidity
  smart-contract framework for music collectibles) and the official @soundxyz
  npm SDK ecosystem (@soundxyz/sdk, sdk-viem, legacy-sdk) for on-chain
  development, alongside GraphQL and caching infrastructure libraries. Added to
  the API Evangelist network as an a16z portfolio company; this profile now
  reflects the enrichment pipeline's findings.
